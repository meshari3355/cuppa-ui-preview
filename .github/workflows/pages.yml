name: Test and publish synthetic preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check preview.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 > /tmp/cuppa-preview-server.log 2>&1 &
          node tests/preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: |
            manager-desktop.png
            worker-desktop.png
            worker-mobile.png
      - run: |
          mkdir site
          cp index.html base.css cuppa-shell.css preview.css preview.js navigation.json .nojekyll site/
          test "$(find site -type f | wc -l)" = "7"
          test -z "$(find site -name '*.php' -o -name '*.sql' -o -name '*.env')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
