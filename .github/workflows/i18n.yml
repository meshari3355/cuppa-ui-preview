name: Verify every preview language
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check i18n-runtime.js && node --check preview.js
      - run: node tests/i18n.mjs
